name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm --filter @paplyn/web typecheck

      - name: Test collab
        run: pnpm --filter @paplyn/collab test

      - name: Test web
        run: pnpm --filter @paplyn/web test

      - name: Test compiler
        run: pnpm --filter @paplyn/compiler test
