# Production overlay: bind services to localhost only.
# Use with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Set secrets and public URLs in your shell or a local .env file (do not commit .env).

services:
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"

  compiler:
    # Production uses the VPS-maintained TeX Live 2026 image (plicum-compiler:latest).
    # Do NOT re-add `build:` here — `docker compose ... up --build` must not rebuild
    # packages/compiler/Dockerfile or swap TeX Live 2026 for the slim Debian runner.
    image: plicum-compiler:latest
    pull_policy: never
    build: !reset null
    ports: !override
      - "127.0.0.1:3001:3001"
    environment:
      # texlive/texlive layout; required so pdflatex/biber/etc. resolve on the prod image.
      PATH: /usr/local/texlive/2026/bin/x86_64-linux:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

  collab:
    ports: !override
      - "127.0.0.1:1234:1234"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://quire:quire@postgres:5432/quire}

  web:
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://quire:quire@postgres:5432/quire}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_COLLAB_URL: ${NEXT_PUBLIC_COLLAB_URL}
      COLLAB_HTTP_URL: ${COLLAB_HTTP_URL:-http://collab:1234}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-selfhosted}
      NEXT_PUBLIC_DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-selfhosted}
      PRODUCT_NAME: ${PRODUCT_NAME:-Plicum}
      NEXT_PUBLIC_PRODUCT_NAME: ${PRODUCT_NAME:-Plicum}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
